description: >-
  Power Platform's client-side component story is Power Apps component framework (PCF) - a
  first-party framework for authoring reusable TypeScript/React components that render inside
  model-driven apps, canvas apps and Power Pages. It is a component AUTHORING framework rather
  than a hosted embeddable widget library, which is the usual shape in this artifact.
families:
