  kind: component-authoring-framework
  docs: https://learn.microsoft.com/en-us/power-apps/developer/component-framework/overview
  languages: [typescript, javascript]
  surfaces:
  - model-driven apps
  - canvas apps
  - Power Pages
  tooling:
    scaffold: pac pcf init
    build: pac pcf push
    cli_group: pac pcf
  note: >-
    Components are packaged into a Dataverse solution and deployed to an environment; they are
